name: keel

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://crm_app:crm_app_dev_password@postgres:5432/keel
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      EMAIL_URL: smtp://mailpit:1025
    # Sizing/timeouts come from config/gunicorn.py (GUNICORN_* variables); run 2+ replicas behind
    # infra/nginx/loadtest.conf to exercise multi-instance behaviour locally.
    command: ["gunicorn", "config.wsgi:application", "-c", "config/gunicorn.py"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]

  # Queue isolation mirrors production: the critical worker never runs imports/exports.
  worker:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://crm_app:crm_app_dev_password@postgres:5432/keel
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    command: ["celery", "-A", "config.celery", "worker", "-l", "info", "-Q", "default,notifications", "-c", "4", "--max-tasks-per-child", "500"]
    # The image health check probes the HTTP port; Celery processes have none.
    healthcheck:
      disable: true
    stop_grace_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]

  worker-heavy:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://crm_app:crm_app_dev_password@postgres:5432/keel
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    command: ["celery", "-A", "config.celery", "worker", "-l", "info", "-Q", "imports,exports,reports", "-c", "2", "--max-tasks-per-child", "100"]
    # The image health check probes the HTTP port; Celery processes have none.
    healthcheck:
      disable: true
    stop_grace_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]

  beat:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://crm_app:crm_app_dev_password@postgres:5432/keel
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    command: ["celery", "-A", "config.celery", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    # The image health check probes the HTTP port; Celery processes have none.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]

  frontend:
    build:
      context: ./frontend
    environment:
      API_INTERNAL_ORIGIN: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    profiles: ["full"]

volumes:
  postgres-data:
