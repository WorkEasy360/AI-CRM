<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#102d3d" />
    <title>Offline · WorkEasy CRM</title>
    <!--
      Shown by public/sw.js only when a page cannot be reached. Deliberately script-free (the CSP
      nonce it was cached with authorises nothing) and self-contained: offline, no other asset loads.
      "Try again" is a plain link to the current address.
    -->
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f2f6f8;
        color: #172b3a;
      }
      main {
        max-width: 22rem;
        padding: 1.5rem;
        text-align: center;
      }
      svg {
        width: 3rem;
        height: 3rem;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.125rem;
      }
      p {
        margin: 0 0 1.25rem;
        font-size: 0.875rem;
        line-height: 1.5;
        color: #475a67;
      }
      a {
        display: inline-block;
        min-height: 2.75rem;
        padding: 0 1.25rem;
        line-height: 2.75rem;
        border-radius: 6px;
        background: #067f4b;
        color: #ffffff;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="96" fill="#102d3d" />
        <path d="M112 152l64 216 80-168 80 168 64-216" fill="none" stroke="#08b96b" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h1>You're offline</h1>
      <p>WorkEasy CRM needs a connection. Nothing is stored on this device.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
