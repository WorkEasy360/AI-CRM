# Android app (Trusted Web Activity generated by Bubblewrap; android/README.md).
#
# - debug-build: every PR that touches android/ proves the project still compiles. No secrets.
# - release: run by hand from the Actions tab. Builds the Play Store bundle (AAB) plus a signed APK
#   for sideload testing, signed with the upload key held in the `android-release` environment
#   (protect it with required reviewers). The key is written to the runner's temp directory for the
#   signing steps only and never leaves it; the signed files are kept as a workflow artifact.
#   Uploading to Play is a manual step in the Play Console.
#
# Uses the JDK 17 and Android SDK preinstalled on ubuntu-latest, so no extra third-party actions.
name: Android

on:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-build:
    if: github.event_name == 'pull_request'
    name: Debug APK builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Assemble debug APK
        working-directory: android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          ./gradlew assembleDebug --no-daemon --console=plain

  release:
    if: github.event_name == 'workflow_dispatch'
    name: Signed AAB for Play
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build unsigned release bundle and APK
        working-directory: android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          ./gradlew bundleRelease assembleRelease --no-daemon --console=plain
      - name: Sign
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is not set in the android-release environment"; exit 1; }
          done
          export JAVA_HOME="$JAVA_HOME_17_X64"
          keystore="$RUNNER_TEMP/upload.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          version="$(grep -oP 'versionName "\K[^"]+' app/build.gradle)"
          code="$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)"
          mkdir -p "$RUNNER_TEMP/out"
          aab="$RUNNER_TEMP/out/keel-${version}-${code}.aab"
          apk="$RUNNER_TEMP/out/keel-${version}-${code}.apk"

          # Same signing Bubblewrap's `build` does: jarsigner for the bundle, zipalign + apksigner for the APK.
          cp app/build/outputs/bundle/release/app-release.aab "$aab"
          "$JAVA_HOME/bin/jarsigner" -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 "$aab" "$KEY_ALIAS"
          "$build_tools/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign --v4-signing-enabled false --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$apk" "$RUNNER_TEMP/aligned.apk"

          "$JAVA_HOME/bin/jarsigner" -verify "$aab" > /dev/null
          "$build_tools/apksigner" verify "$apk"
          rm -f "$keystore" "$RUNNER_TEMP/aligned.apk"
          # The upload key's fingerprint is public; it belongs in frontend/public/.well-known/assetlinks.json.
          echo "### Upload key SHA-256 (for assetlinks.json)" >> "$GITHUB_STEP_SUMMARY"
          "$build_tools/apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256' | sed 's/.*: //' | sed 's/../&:/g; s/:$//' | tr 'a-f' 'A-F' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keel-android-release
          path: ${{ runner.temp }}/out/
          retention-days: 14
          if-no-files-found: error
