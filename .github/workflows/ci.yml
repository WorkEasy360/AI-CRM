name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.21"
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  backend-tests:
    name: Backend tests (tenant isolation, authz matrix, security regression)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Create least-privilege runtime role (no superuser, no RLS bypass)
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE crm_app LOGIN PASSWORD 'crm_app_dev_password' NOSUPERUSER NOBYPASSRLS CREATEDB NOCREATEROLE;" \
            -c "CREATE DATABASE keel OWNER crm_app;"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install
        working-directory: backend
        run: uv sync --frozen
      - name: Migrations are in sync with models
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests with coverage
        working-directory: backend
        run: uv run pytest --cov --cov-report=xml --cov-fail-under=80 -p no:cacheprovider
      - name: RLS coverage on migrated database
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: uv run python manage.py migrate --no-input && uv run python manage.py rls_check
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  backend-quality:
    name: Backend lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - working-directory: backend
        run: uv sync --frozen
      - working-directory: backend
        run: uv run ruff check . && uv run ruff format --check .
      - working-directory: backend
        run: uv run mypy .

  backend-security:
    name: Backend SAST + dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - working-directory: backend
        run: uv sync --frozen
      - name: Bandit
        working-directory: backend
        run: uv run bandit -c pyproject.toml -r apps config security -q
      - name: pip-audit
        working-directory: backend
        run: uv run pip-audit --strict
      - name: Semgrep (Django + Python rulesets + project rules)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/django
            p/python
            security/semgrep/keel.yml
        env:
          SEMGREP_RULES: p/django p/python security/semgrep/keel.yml

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  frontend:
    name: Frontend lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - working-directory: frontend
        run: pnpm audit --audit-level=high
      - working-directory: frontend
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build

  containers:
    name: Container build + Trivy scan
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: keel-backend:${{ github.sha }}
      - name: Trivy (fail on HIGH/CRITICAL with fixes)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: keel-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: keel-backend:${{ github.sha }}
          format: cyclonedx
          output: sbom-backend.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: sbom-backend.cdx.json
