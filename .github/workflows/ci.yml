name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.21"
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  backend-tests:
    name: Backend tests (tenant isolation, authz matrix, security regression)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # pgvector build of PostgreSQL 16 (the RAG index needs `vector`); same image as local dev and
        # deploy/ec2. Plain postgres:16-alpine has no vector extension, so the test database never migrated.
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create least-privilege runtime role (no superuser, no RLS bypass)
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE crm_app LOGIN PASSWORD 'crm_app_dev_password' NOSUPERUSER NOBYPASSRLS CREATEDB NOCREATEROLE;" \
            -c "CREATE DATABASE keel OWNER crm_app;"
          # `vector` is not a trusted extension: the superuser installs it (as infra/postgres/init/02-extensions.sql
          # does locally), in template1 so the test database inherits it; migrations then find it present.
          for db in template1 keel; do
            PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d "$db" -v ON_ERROR_STOP=1 \
              -c "CREATE EXTENSION IF NOT EXISTS vector;"
          done
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install
        working-directory: backend
        run: uv sync --frozen
      - name: Migrations are in sync with models
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests with coverage
        working-directory: backend
        run: uv run pytest --cov --cov-report=xml --cov-fail-under=80 -p no:cacheprovider
      - name: RLS coverage on migrated database
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: uv run python manage.py migrate --no-input && uv run python manage.py rls_check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  backend-quality:
    name: Backend lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
      - working-directory: backend
        run: uv sync --frozen
      - working-directory: backend
        run: uv run ruff check . && uv run ruff format --check .
      - working-directory: backend
        run: uv run mypy .

  backend-security:
    name: Backend SAST + dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
      - working-directory: backend
        run: uv sync --frozen
      - name: Bandit
        working-directory: backend
        run: uv run bandit -c pyproject.toml -r apps config security -q
      - name: pip-audit
        working-directory: backend
        run: uv run pip-audit --strict
      # Semgrep runs from the backend project so the version is the one pinned in backend/uv.lock
      # (1.177.0), installed by the `uv sync --frozen` above. The retired semgrep-action shipped
      # 1.36.0, which is below the 1.76 floor upstream still supports and which matched `nosemgrep`
      # ids only literally, so the namespaced ids the project rules are loaded under never applied.
      # The target is the repository root so the Python outside backend/ stays covered, as it was
      # under the action. This is also the invocation `make security` uses, so local and CI agree.
      - name: Semgrep (Django + Python rulesets + project rules)
        working-directory: backend
        run: >-
          uv run semgrep scan --error --quiet --metrics=off --exclude .venv
          --config p/django --config p/python --config ../security/semgrep/keel.yml ..

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Full-history scan with the pinned gitleaks image (the same command runs locally). gitleaks-action
      # scanned only `<first pushed commit>^..<last>` on push events, which is not a valid range when the
      # push contains the root commit, so git errored and the job failed without scanning anything.
      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  frontend:
    name: Frontend lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - working-directory: frontend
        run: pnpm audit --audit-level=high
      - working-directory: frontend
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      # The production server must actually hydrate under the nonce-based CSP. A statically
      # prerendered page ships nonce-less scripts that 'strict-dynamic' blocks, which `next build`
      # cannot detect; only a browser against the standalone server can.
      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Production hydration smoke (standalone server, no backend)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: |
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true
          (cd .next/standalone && HOSTNAME=127.0.0.1 PORT=3000 API_INTERNAL_ORIGIN=http://127.0.0.1:9 node server.js &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/health && break; sleep 1; done
          pnpm exec playwright test tests/e2e/smoke.spec.ts

  containers:
    name: Container build + Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          push: false
          load: true
          tags: keel-backend:${{ github.sha }}
      - name: Trivy (fail on HIGH/CRITICAL with fixes)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: keel-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: keel-backend:${{ github.sha }}
          format: cyclonedx
          output: sbom-backend.cdx.json
      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          push: false
          load: true
          tags: keel-frontend:${{ github.sha }}
      - name: Trivy frontend (fail on HIGH/CRITICAL with fixes)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: keel-frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: SBOM frontend (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: keel-frontend:${{ github.sha }}
          format: cyclonedx
          output: sbom-frontend.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: |
            sbom-backend.cdx.json
            sbom-frontend.cdx.json

  infrastructure:
    name: Terraform fmt + validate, k6 scripts parse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: terraform validate
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false && terraform validate
      - name: Trivy IaC scan (Terraform misconfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          exit-code: "1"
          severity: HIGH,CRITICAL
      # `inspect` runs the init context, which parses users.json. The real file comes from
      # `manage.py seed_loadtest` (git-ignored), so parse against a synthetic fixture instead.
      - name: k6 scripts parse
        run: |
          printf '%s' '{"password":"ci-parse-only","users":[{"email":"ci@example.invalid","org":"ci","size":"small"}]}' \
            > "$RUNNER_TEMP/users.json"
          docker run --rm -v "$PWD/loadtest/k6:/scripts" -v "$RUNNER_TEMP/users.json:/scripts/users.json:ro" \
            grafana/k6:0.54.0 inspect /scripts/main.js
