# Production deploy: build immutable images, scan them, push to ECR with OIDC credentials (no long-lived
# keys), run the migration task, then roll each ECS service with health-checked, circuit-broken rollouts.
#
# Rollout order matters for expand/contract migrations (docs/architecture/scaling.md, "Deployments"):
# migrate (additive only) -> workers -> api -> web. Every service uses minimum healthy 100% / maximum 200%,
# so new tasks must pass /health/ready before old ones drain (deregistration delay 30s).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  id-token: write # OIDC to assume the deploy role created by infra/terraform/iam.tf
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  PROJECT: keel

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          push: false
          load: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          push: false
          load: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Images are scanned again here (the CI scan covered the PR build); a HIGH/CRITICAL with a fix blocks the deploy.
      - name: Trivy scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-api:${{ github.sha }}
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Trivy scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-web:${{ github.sha }}
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Push images
        run: |
          docker push "${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-api:${{ github.sha }}"
          docker push "${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-web:${{ github.sha }}"

      - name: Register task definitions with the new image
        id: taskdefs
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ENV_NAME: ${{ inputs.environment || 'staging' }}
        run: |
          set -euo pipefail
          register() { # $1 family, $2 image
            aws ecs describe-task-definition --task-definition "$1" --query 'taskDefinition' \
              | jq --arg IMG "$2" 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
                    | .containerDefinitions |= map(.image = $IMG)' > "/tmp/$1.json"
            aws ecs register-task-definition --cli-input-json "file:///tmp/$1.json" --query 'taskDefinition.taskDefinitionArn' --output text
          }
          API_IMG="$REGISTRY/$PROJECT-api:${{ github.sha }}"
          WEB_IMG="$REGISTRY/$PROJECT-web:${{ github.sha }}"
          for fam in migrate worker-critical worker-heavy beat api; do
            echo "$fam=$(register "$PROJECT-$ENV_NAME-$fam" "$API_IMG")" >> "$GITHUB_OUTPUT"
          done
          echo "web=$(register "$PROJECT-$ENV_NAME-web" "$WEB_IMG")" >> "$GITHUB_OUTPUT"

      - name: Run database migrations (one-off task, expand-only migrations)
        env:
          CLUSTER: ${{ env.PROJECT }}-${{ inputs.environment || 'staging' }}
        run: |
          set -euo pipefail
          NETCFG=$(aws ecs describe-services --cluster "$CLUSTER" --services "$CLUSTER-api" \
            --query 'services[0].networkConfiguration' --output json)
          TASK=$(aws ecs run-task --cluster "$CLUSTER" --launch-type FARGATE \
            --task-definition "${{ steps.taskdefs.outputs.migrate }}" \
            --network-configuration "$NETCFG" --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK"
          CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" --query 'tasks[0].containers[0].exitCode' --output text)
          echo "migrate exit code: $CODE"; [ "$CODE" = "0" ]

      - name: Roll services (workers, api, then web)
        env:
          CLUSTER: ${{ env.PROJECT }}-${{ inputs.environment || 'staging' }}
        run: |
          set -euo pipefail
          roll() { aws ecs update-service --cluster "$CLUSTER" --service "$CLUSTER-$1" --task-definition "$2" >/dev/null; }
          roll worker-critical "${{ steps.taskdefs.outputs.worker-critical }}"
          roll worker-heavy    "${{ steps.taskdefs.outputs.worker-heavy }}"
          roll beat            "${{ steps.taskdefs.outputs.beat }}"
          roll api             "${{ steps.taskdefs.outputs.api }}"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$CLUSTER-api"
          roll web             "${{ steps.taskdefs.outputs.web }}"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$CLUSTER-web" "$CLUSTER-worker-critical" "$CLUSTER-worker-heavy" "$CLUSTER-beat"

      - name: Smoke check through the edge
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          [ -z "$APP_URL" ] && { echo "APP_URL not set; skipping"; exit 0; }
          curl -fsS "$APP_URL/health" >/dev/null
          curl -fsS -o /dev/null -w '%{http_code}\n' "$APP_URL/api/v1/session/" | grep -q '^403$'
