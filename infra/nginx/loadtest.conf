# Local stand-in for the production ALB (docker-compose.loadtest.yml): two Django instances,
# round-robin, same path routing as infra/terraform/alb.tf. Not for production use.

upstream api {
    server backend-a:8000 max_fails=3 fail_timeout=10s;
    server backend-b:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream web {
    server frontend:3000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;   # ALB idle timeout equivalent
    proxy_send_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    location ~ ^/(api|_allauth)/ { proxy_pass http://api; }
    location ~ ^/(health|ready)/ { return 404; }
    location /admin/             { return 404; }
    location /                   { proxy_pass http://web; }
}
