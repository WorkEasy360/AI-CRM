# Same-origin reverse proxy: API and auth paths go to Django, everything else to Next.js.
# TLS terminates at the load balancer in production; this config is for the container network.

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=600r/m;

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    server_tokens off;

    # The proxy is the only source of truth for these headers.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Powered-By;

    location /_allauth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://backend;
    }

    location /api/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://backend;
    }

    location ~ ^/(health|ready)/$ {
        proxy_pass http://backend;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
