[project]
name = "keel-backend"
version = "0.1.0"
description = "Keel CRM backend (Django 5.2 LTS, DRF, PostgreSQL, Celery)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "psycopg[binary,pool]>=3.2",
    "django-allauth[mfa]>=65.10",
    "django-csp>=4.0",
    "django-environ>=0.12",
    "celery[redis]>=5.5",
    "django-celery-beat>=2.8",
    "django-redis>=6.0",
    "drf-spectacular>=0.28",
    "argon2-cffi>=23.1",
    "structlog>=25.4",
    "gunicorn>=23.0",
    "boto3>=1.43.93",
    "anthropic>=1.0",
    # pgvector: Django field, HNSW index and distance expressions for the RAG knowledge index.
    "pgvector>=0.4",
    "httpx>=0.28",
    "cryptography>=45",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-django>=4.11",
    "factory-boy>=3.3",
    "pytest-cov>=6.2",
    "freezegun>=1.5",
    "ruff>=0.12",
    "mypy>=1.17",
    "django-stubs[compatible-mypy]>=5.2",
    "djangorestframework-stubs>=3.16",
    "bandit>=1.8",
    "semgrep>=1.130",
    "pip-audit>=2.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps", "tests"]
addopts = "-q --strict-markers --reuse-db"
markers = [
    "security: security regression tests",
]
filterwarnings = ["error::DeprecationWarning:apps.*"]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ", "N", "SIM", "T20", "RUF"]
ignore = ["S101", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311"]
"tests/**" = ["S105", "S106", "S311", "N803"]
"config/settings/*" = ["S105"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = false
warn_unused_ignores = true
disallow_untyped_defs = false
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["apps.core.tenancy.*", "apps.authz.service", "apps.authz.catalogue", "apps.authz.roles"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["allauth.*", "django_celery_beat.*", "django_redis.*", "environ.*", "csp.*", "celery.*", "boto3.*", "botocore.*", "redis.*", "anthropic.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
skips = ["B101"]

[tool.coverage.run]
source = ["apps", "config", "security"]
omit = ["*/migrations/*", "*/tests/*"]
